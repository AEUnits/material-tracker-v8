<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Material App - Link Retired</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background: #f3f4f6;
            font-family: Arial, Helvetica, sans-serif;
            color: #1f2937;
        }
        .card {
            max-width: 440px;
            width: 100%;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
            padding: 36px 28px;
            text-align: center;
        }
        .icon {
            font-size: 48px;
            line-height: 1;
            margin-bottom: 12px;
        }
        h1 {
            margin: 0 0 12px;
            font-size: 22px;
            font-weight: 800;
        }
        p {
            margin: 0;
            font-size: 16px;
            line-height: 1.5;
            color: #4b5563;
        }
        .highlight {
            margin-top: 20px;
            padding: 14px 16px;
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 10px;
            color: #0052b4;
            font-weight: 700;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">&#9888;&#65039;</div>
        <h1>This Link Is Outdated</h1>
        <p>This version of the Material App is no longer in use.</p>
        <div class="highlight">Please request the new Material App link.</div>
    </div>
</body>
</html>
